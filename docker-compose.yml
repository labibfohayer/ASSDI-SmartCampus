services:
  db:
    image: postgres:16-alpine
    container_name: assdi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-assdi_db}
      POSTGRES_USER: ${DB_USER:-assdi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assdi_secure_password_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-assdi_user} -d ${DB_NAME:-assdi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: assdi_postgres_data
