<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন মোড | আস-সুন্নাহ স্কিল ডেভেলপমেন্ট ইনস্টিটিউট</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
      background-color: #F8FAF9;
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #E5E7EB;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(27, 77, 62, 0.08);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      border-radius: 16px;
      background: #E8F5E9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #F59E0B;
      border-radius: 50%;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1B4D3E;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #4B5563;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #1B4D3E;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #14382D;
    }
    .footer-text {
      margin-top: 24px;
      font-size: 12px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo.png" alt="ASSDI Logo" onerror="this.style.display='none'">
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>ইন্টারনেট সংযোগ নেই</span>
    </div>
    <h1>আপনি অফলাইনে আছেন</h1>
    <p>
      আপনার ডিভাইসে ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। ইন্টারনেট কানেকশন চেক করে আবার চেষ্টা করুন। একবার লোড করা পেজগুলো ইন্টারনেট ছাড়াও ব্রাউজ করা যাবে।
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      পুনরায় চেষ্টা করুন
    </button>
  </div>
  <div class="footer-text">
    আস-সুন্নাহ স্কিল ডেভেলপমেন্ট ইনস্টিটিউট (ASSDI)
  </div>
</body>
</html>
